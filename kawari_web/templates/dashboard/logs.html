{% extends "base.html" %}
{% block title %}Logs · {{ branding.site_name }}{% endblock %}
{% block content %}
<h1>Dashboard</h1>
{% include "dashboard/_nav.html" %}
<section class="card">
  <h2>Container logs</h2>
  {% if hint %}<p class="line err">{{ hint }}</p>{% endif %}
  <form method="get" class="inline">
    <label>Lines <input type="number" name="tail" value="{{ tail }}" min="50" max="2000"></label>
    <button class="btn" type="submit">Refresh</button>
  </form>
  <pre class="logs">{{ text }}</pre>
</section>
{% endblock %}
